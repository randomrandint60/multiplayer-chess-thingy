<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; padding: 20px; font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; color: #333; }
    h3 { margin-top: 0; color: #1a73e8; font-size: 20px; text-align: center; }
    
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center; }
    #status { font-size: 14px; margin-bottom: 15px; font-weight: 500; color: #5f6368; }
    
    button { width: 100%; padding: 12px; margin: 5px 0; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; transition: 0.2s; }
    #startBtn { background-color: #1a73e8; color: white; }
    #startBtn:hover:not(:disabled) { background-color: #1557b0; }
    #stopBtn { background-color: #ea4335; color: white; }
    #stopBtn:hover:not(:disabled) { background-color: #d33426; }
    button:disabled { background-color: #e0e0e0; color: #9e9e9e; cursor: not-allowed; }
    
    .recordings-section { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-height: 300px; overflow-y: auto; }
    .recordings-section h4 { margin: 0 0 10px 0; font-size: 15px; color: #202124; }
    
    .note-card { background: #f1f3f4; padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: left; position: relative; }
    .note-date { font-size: 11px; font-weight: bold; color: #5f6368; margin-bottom: 8px; }
    .note-content { font-size: 13px; line-height: 1.4; white-space: pre-wrap; }
    .delete-btn { position: absolute; top: 10px; right: 10px; background: #ea4335; color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 10px; width: auto; }
  </style>
</head>
<body>

  <div class="card">
    <h3>Meeting AI</h3>
    <div id="status">Ready to record.</div>
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
  </div>

  <div class="recordings-section">
    <h4>Your Meeting Notes</h4>
    <div id="recordingsList">
      </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
